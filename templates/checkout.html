<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de compra</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="placetopay-process-url" content="{{ process_url|default('', true)|e }}">
    <script src="https://checkout-test.placetopay.com/lightbox.min.js"></script>
    <script src="/static/lightbox.js" defer></script>
</head>
<body>
    <header>
        <h1>Datos del comprador</h1>
        <p>Producto de prueba - $50.000 COP</p>
    </header>

    <main>
        <form method="post" action="/crear-pago">
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="form-group">
                <label for="surname">Apellido:</label>
                <input id="surname" name="surname" type="text" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="form-group">
                <label for="document">Documento:</label>
                <input id="document" name="document" type="text" required>
            </div>

            <div class="form-group">
                <label for="mobile">Celular:</label>
                <input id="mobile" name="mobile" type="tel" required>
            </div>

            <button class="button" type="submit">Confirmar el paso pago</button>
        </form>
    </main>

</body>
</html>
